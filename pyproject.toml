[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tether"
version = "0.11.0"
description = "Turn research papers into a citation-checked Obsidian knowledge graph"
requires-python = ">=3.10"
dependencies = [
  "anthropic>=0.40",
  "pymupdf>=1.24",
  "rapidfuzz>=3.0",
  "httpx>=0.27",
  "python-dotenv>=1.0",
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
tether = "tether.cli:main"

[tool.setuptools]
packages = ["tether"]

[tool.setuptools.package-data]
tether = ["web/*.html"]
